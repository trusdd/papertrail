[project]
name = "papertrail"
version = "0.1.0"
description = "Local document organizer with OCR search for regular people"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "trusdd" }
]
dependencies = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
    "pdf2image>=1.16.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
papertrail = "papertrail.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
